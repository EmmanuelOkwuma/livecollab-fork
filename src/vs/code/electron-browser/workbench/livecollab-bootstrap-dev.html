<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
	<title>LiveCollab</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body {
			width: 100%; height: 100%;
			background: #181818;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
			color: #CCCCCC;
			overflow: hidden;
		}
		#lc-root {
			position: fixed; inset: 0;
			display: flex; align-items: center; justify-content: center;
			background: #181818;
			z-index: 9999;
		}
		.lc-center {
			display: flex; flex-direction: column; align-items: center;
			gap: 0;
		}
		.lc-logo {
			width: 72px; height: 72px; margin-bottom: 20px;
		}
		.lc-name {
			font-size: 30px; font-weight: 700;
			color: #CCCCCC; letter-spacing: -0.5px;
			margin-bottom: 8px;
		}
		.lc-tagline {
			font-size: 14px; color: #9D9D9D;
			margin-bottom: 36px;
		}
		.lc-btn {
			width: 300px; height: 40px;
			display: flex; align-items: center; justify-content: center;
			border-radius: 8px; cursor: pointer;
			font-size: 14px; font-weight: 500;
			border: 1px solid transparent;
			transition: background 120ms ease, border-color 120ms ease;
			margin-bottom: 10px;
			user-select: none;
		}
		.lc-btn-signin {
			background: #2F5C8A; border-color: #356399; color: #FFFFFF;
		}
		.lc-btn-signin:hover { background: #356BA0; }
		.lc-btn-signup {
			background: #2A2D34; border-color: #3A3F47; color: #E4E4E4;
		}
		.lc-btn-signup:hover { background: #32363E; }
		.lc-foot {
			margin-top: 28px;
			font-size: 11px; color: #4A4A4A; text-align: center;
		}
	</style>
</head>
<body>
	<div id="lc-root">
		<div class="lc-center">
			<svg class="lc-logo" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
				<rect width="72" height="72" rx="16" fill="#1A1A2E"/>
				<ellipse cx="28" cy="30" rx="10" ry="10" fill="url(#bigpin)"/>
				<ellipse cx="44" cy="44" rx="7" ry="7" fill="url(#smallpin)"/>
				<defs>
					<radialGradient id="bigpin" cx="40%" cy="35%" r="60%">
						<stop offset="0%" stop-color="#4D9FFF"/>
						<stop offset="100%" stop-color="#1D5FD6"/>
					</radialGradient>
					<radialGradient id="smallpin" cx="40%" cy="35%" r="60%">
						<stop offset="0%" stop-color="#6BB8FF"/>
						<stop offset="100%" stop-color="#2E6BE6"/>
					</radialGradient>
				</defs>
			</svg>
			<div class="lc-name">LiveCollab</div>
			<div class="lc-tagline">Code together, in real time</div>
			<div class="lc-btn lc-btn-signin" id="btn-signin">Sign In</div>
			<div class="lc-btn lc-btn-signup" id="btn-signup">Sign Up</div>
			<div class="lc-foot">Live collaboration features require you to be signed in.</div>
		</div>
	</div>
	<script>
		// Signal to the main process that the page is painted and the window can be shown.
		window.addEventListener('DOMContentLoaded', () => {
			// Small rAF ensures the paint has actually happened before we show.
			requestAnimationFrame(() => {
				requestAnimationFrame(() => {
					if (window.vscode?.ipcRenderer) {
						window.vscode.ipcRenderer.send('vscode:livecollab-ready');
					}
				});
			});
		});

		// Button handlers — will wire to real auth flow in next build step.
		document.getElementById('btn-signin').addEventListener('click', () => {
			if (window.vscode?.ipcRenderer) {
				window.vscode.ipcRenderer.send('vscode:livecollab-signin');
			}
		});
		document.getElementById('btn-signup').addEventListener('click', () => {
			if (window.vscode?.ipcRenderer) {
				window.vscode.ipcRenderer.send('vscode:livecollab-signup');
			}
		});
	</script>
</body>
</html>
